<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이름 입력</title>

    <style>
        body {
            font-family: "맑은 고딕", sans-serif;
            margin: 40px;
        }

        .container {
            width: 600px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        label {
            font-size: 30px;
        }

        input {
            width: 220px;
            height: 50px;
            font-size: 24px;
            padding: 5px 10px;
        }

        button {
            width: 100px;
            height: 65px;
            font-size: 24px;
            cursor: pointer;
        }

        #result {
            font-size: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="row">
        <label for="name">이름</label>

        <input type="text" id="name">

        <button onclick="showName()">입력</button>
    </div>

    <p id="result">
        당신의 이름은 ______ 입니다.
    </p>

</div>

<script>
    function showName() {
        const name = document.getElementById("name").value;

        document.getElementById("result").textContent =
            `당신의 이름은 ${name} 입니다.`;
    }
</script>

</body>
</html>
