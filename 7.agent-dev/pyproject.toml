[project]
name = "agent-dev"
version = "0.1.0"
description = "3과목 멀티 에이전트 협업 및 서비스 운영 — 교육생 실습 환경"
requires-python = ">=3.11"
dependencies = [
    # 모델 호출·에이전트 (M1~M3 노트북)
    "langchain>=1.3.9",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.3.2",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.5",
    "langsmith>=0.8.16",
    "mcp>=1.30.0",
    "openai>=2.41.1",
    "pydantic>=2.13.4",
    "typing-extensions>=4.15.0",
    "tenacity>=9.1.4",
    # 서비스·대시보드 (M2·M3 키트)
    "fastapi>=0.139.0",
    "uvicorn>=0.49.0",
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
    "psycopg2-binary>=2.9.12",
    # 공통
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "ipykernel>=7.3.0",
]

[dependency-groups]
# uv sync가 기본으로 함께 설치한다 (M2 Day 8 CI 테스트)
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
]
